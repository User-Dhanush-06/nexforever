spring.application.name=nexforever-platform

# Load root .env whether started from repository root or backend/
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexforever_db}
spring.datasource.username=${DB_USERNAME:nexforever_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Flyway owns DDL; Hibernate validates schema mappings)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server & Cookie Session Hardening
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=4h

# Multipart Media Uploads
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=15MB

# Actuator Health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Application Security, Media & Hybrid Assistant Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.ip-hash-salt=${APP_IP_HASH_SALT:nexforever-local-dev-salt}
app.admin.bootstrap.email=${ADMIN_EMAIL:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
app.admin.bootstrap.full-name=${ADMIN_FULL_NAME:NexForever Studio Admin}
app.media.upload-dir=${APP_MEDIA_UPLOAD_DIR:}
app.chitti.ai.enabled=${CHITTI_AI_ENABLED:false}
app.chitti.ai.provider=${CHITTI_AI_PROVIDER:none}